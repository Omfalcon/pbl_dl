# YOLOv8n Object Detection (M-04) Synthetic UI Experiment Configuration
# PhishVision AI - Phase 7.2-7.4

model:
  model_id: "M-04"
  architecture: "YOLOv8n"
  weights: "yolov8n.pt"               # Ultralytics pre-trained nano weights
  num_classes: 6
  classes:
    0: "brand_logo"
    1: "login_form"
    2: "username_field"
    3: "password_field"
    4: "submit_button"
    5: "payment_element"

data:
  dataset_yaml: "data/synthetic_yolo/dataset.yaml"
  imgsz: 512                          # 512x512 resolution (hardware-aware for 4GB VRAM)
  workers: 2                          # Conservative dataloader workers for Windows

training:
  random_seed: 42
  batch_size: 4                       # Conservative batch size for RTX 2050 4GB VRAM
  epochs: 30
  patience: 10                        # Early stopping patience
  device: 0                           # GPU device ID (falls back to cpu if unavailable)
  half: true                          # FP16 mixed precision for fast inference & lower VRAM
  optimizer: "auto"
  save: true
  save_period: -1
  plots: true                         # Automatically generate loss curves and confusion matrices

paths:
  project: "models/checkpoints/yolov8n_synthetic"
  name: "run1"
  report_dir: "data/reports/yolo"
